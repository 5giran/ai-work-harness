[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-work-harness"
version = "0.5.0"
description = "Local, evidence-bound control plane for reviewable AI-assisted decisions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "5giran" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
openai = [
  "openai>=1,<3",
]
mcp = [
  "mcp>=1,<2",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
ai-work-harness = "ai_work_harness.cli:main"
ai-work-harness-mcp = "ai_work_harness.decision.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_work_harness.schemas.v1" = ["*.json"]
"ai_work_harness.schemas.v2" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["ai_work_harness"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
