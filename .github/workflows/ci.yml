name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development and optional integration contracts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,openai,mcp]'
          python -m pip check
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src/ai_work_harness
      - name: Unit and contract tests with coverage gate
        run: |
          pytest \
            --cov=ai_work_harness \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90
      - name: One-invocation guided fixture demo
        if: matrix.python-version == '3.12'
        run: |
          python scripts/run_synthetic_decision_demo.py \
            --root "$RUNNER_TEMP/ai-work-harness-guided-demo" \
            --test-operator \
            --lang en
      - name: Build sdist and wheel
        run: python -m build
      - name: Clean-wheel CLI and resource smoke
        run: |
          python -m venv wheel-smoke
          python -m pip --python wheel-smoke install dist/*.whl
          python -m pip --python wheel-smoke check
          python scripts/ci_smoke.py --venv wheel-smoke

  cross-platform-wheel:
    name: Python 3.12 wheel smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel into a clean environment
        shell: bash
        run: |
          python -m venv wheel-smoke
          python -m pip --python wheel-smoke install dist/*.whl
          python -m pip --python wheel-smoke check
      - name: CAS, lock, schema resource, and CLI smoke
        run: python scripts/ci_smoke.py --venv wheel-smoke

  viewer:
    name: Offline decision viewer (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type and generated-file check
        run: |
          npm run lint
          git diff --exit-code -- src/generated public/examples
      - name: Unit and integrity tests
        run: npm test
      - name: Static production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Offline browser, tamper, and accessibility E2E
        run: npm run test:e2e
